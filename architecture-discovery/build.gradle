plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.google.protobuf' version '0.10.0' // the root build's version, 2026-10-29
    id 'com.diffplug.spotless' version '8.10.4' // the root build's version, 2026-10-29
}

// google-java-format in the AOSP style, the README's Formatting, at the version Spotless ships with: a newer one
// fails inside Spotless on this JDK. spotlessCheck joins check. The generated sources stay as protoc writes them.
spotless {
    java {
        target 'src/*/java/**/*.java'
        targetExclude 'src/generated/**'
        googleJavaFormat().aosp()
    }
}

group = 'dk.mathmagicians.playground'
version = '0.1.0-SNAPSHOT'
description = 'The hexagon of an application as a PlantUML diagram, from its jMolecules stereotypes and Spring Modulith modules'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

// every version is pinned with its date; the Boot BOM only aligns the Spring versions Modulith builds on
dependencies {
    api platform('org.springframework.boot:spring-boot-dependencies:4.1.1') // 2026-09-08
    api platform('org.springframework.modulith:spring-modulith-bom:2.1.1') // 2026-09-08
    api platform('org.jmolecules:jmolecules-bom:2025.0.2') // 2026-09-08
    api 'org.springframework.modulith:spring-modulith-core'
    // the Modulith BOM's 1.4.2 has no isSealed and getPermittedSubclasses, the root build runs 1.5.0, 2026-09-08
    api 'com.tngtech.archunit:archunit:1.5.0'
    api 'org.jmolecules.integrations:jmolecules-stereotype'
    // the model's generated classes and TextFormat, the DSL's reader and writer
    api 'com.google.protobuf:protobuf-java'
    // the stereotype catalog reader, optional in jmolecules-stereotype, required by HexagonDocumenter's default
    implementation 'com.jayway.jsonpath:json-path'
    // Modulith reads the module detection strategy through Boot's configuration data at runtime
    runtimeOnly 'org.springframework.boot:spring-boot'
    testImplementation platform('org.junit:junit-bom:6.1.3') // 2026-09-08
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7' // 2026-09-08
    testImplementation 'org.jmolecules:jmolecules-hexagonal-architecture'
    testImplementation 'org.jmolecules:jmolecules-ddd'
    // the fixture's wiring annotations; the library reads annotations by name and needs nothing of Spring itself
    testImplementation 'org.springframework.boot:spring-boot-autoconfigure'
}

tasks.named('test') {
    useJUnitPlatform()
}

// protoc at the version of protobuf-java on the class path, the Boot BOM's
def protobufJavaVersion = configurations.compileClasspath.incoming.resolutionResult.allComponents
        .find { it.moduleVersion.name == 'protobuf-java' }.moduleVersion.version

// the model's schema, src/main/proto/hexagon.proto; the generated code is committed under src/generated, see
// README: Repository layout, and regenerated with make proto-gen
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufJavaVersion}"
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.notCompatibleWithConfigurationCache('protobuf-gradle-plugin 0.10.0 keeps Project state in the task')
            if (task.sourceSet.name == 'main') {
                task.outputBaseDirProperty.set(layout.projectDirectory.dir('src/generated'))
            }
        }
    }
}

// plain directories, so no build depends on the generate task
sourceSets {
    main {
        java.srcDirs = ['src/main/java', 'src/generated/java']
    }
}

// the jar and its sources to GitHub Packages under the repository; GITHUB_ACTOR and GITHUB_TOKEN from the
// environment, CI's own or `gh auth token` on a developer machine
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/mathmagicians/wonderland-eventing-playground')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
