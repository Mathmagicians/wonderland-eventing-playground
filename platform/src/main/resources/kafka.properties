# every client setting of the kafka transport, Confluent Cloud included; the broker and the registry are the local
# ones of make kafka-universe-up unless the environment names others, as confluent's does
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# the key is a string, the value the payload message through Confluent's Protobuf serializer: magic byte, the
# schema id from the registry, the message index, then the bytes
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.protobuf.KafkaProtobufSerializer

# the consumer reads keys as strings and values as the bytes on the wire; the consumer adapter's reader resolves
# the schema id through the registry and hands the story a record
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
# a new consumer group starts at the beginning of the topic, so a story sees what was there before it came
spring.kafka.consumer.auto-offset-reset=earliest

# Schema Registry, the same settings for the serializer and the test suite
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_REST_ENDPOINT:http://localhost:8081}
# infrastructure registers the schemas, a producer never does; it serializes with the latest registered version of
# its subject and fails when its message does not match
spring.kafka.producer.properties.auto.register.schemas=false
spring.kafka.producer.properties.use.latest.version=true
# a schema's imports live under the imported payloads' topic subjects, where infrastructure registers them
spring.kafka.producer.properties.reference.subject.name.strategy=dk.mathmagicians.wonderland.eventing.adapter.kafka.ReferenceSubjects

# every in-sync replica acknowledges before the send completes
spring.kafka.producer.acks=all
# a retried send keeps its sequence number, so the broker drops the duplicate and keeps the order
spring.kafka.producer.properties.enable.idempotence=true
# envelopes are small text-heavy Protobuf; lz4 shrinks them at little CPU cost
spring.kafka.producer.compression-type=lz4
# a send waits up to 20 ms for the batch to fill; the threads of one generator share the batch
spring.kafka.producer.properties.linger.ms=20
# 64 KiB per partition batch, room for a few hundred envelopes
spring.kafka.producer.batch-size=64KB

# the clients' plumbing at WARN: the config dump of every client, the version banner, the metrics reporters, the
# telemetry collector, the offset seeks, and the cluster id; a consumer's and a producer's lifecycle, and the
# group coordinator, stay at INFO
logging.level.org.apache.kafka.common.config.AbstractConfig=WARN
logging.level.org.apache.kafka.common.utils.AppInfoParser=WARN
logging.level.org.apache.kafka.common.metrics.Metrics=WARN
logging.level.org.apache.kafka.clients.telemetry.internals.KafkaMetricsCollector=WARN
logging.level.org.apache.kafka.clients.consumer.internals.SubscriptionState=WARN
logging.level.org.apache.kafka.clients.Metadata=WARN
