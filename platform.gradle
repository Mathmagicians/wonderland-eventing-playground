// The platform's Gradle conventions, shared by every build that plays stories on it: this repository's projects,
// and a story's own build. A story's build declares the Boot and dependency-management plugins, applies this
// file, and lists its dependencies:
//
//   plugins {
//       id 'org.springframework.boot' version '4.1.1'
//       id 'io.spring.dependency-management' version '1.1.7'
//   }
//   apply from: "${findProperty('platformGradle') ?: '../../platform.gradle'}"
//
// with springBootVersion=4.1.1 in its gradle.properties, the one version named twice. What it gives: the version
// from git tags, the repositories, the Java toolchain, the Boot BOM, the test and bdd tasks, publishing for
// libraries, and for the project that builds the image: the main class, the image name, and the architecture
// documents.

// version from git tags: at v1.2.3 it is 1.2.3, after it 1.2.4-SNAPSHOT, with no tag 0.0.1-SNAPSHOT
def describe = providers.exec {
    commandLine 'git', 'describe', '--tags', '--match', 'v*', '--long', '--always'
}.standardOutput.asText.get().trim()
def tagged = describe =~ /^v(\d+)\.(\d+)\.(\d+)-(\d+)-g[0-9a-f]+$/
def (major, minor, patch, commits) = tagged.matches() ? (1..4).collect { tagged[0][it] as int } : [0, 0, 0, 1]
def nextVersion = "${major}.${minor}.${patch + 1}"
version = commits == 0 ? "${major}.${minor}.${patch}" : "${nextVersion}-SNAPSHOT"
def ourGroup = 'dk.mathmagicians.playground'
group = ourGroup

tasks.register('version') {
    description = 'Prints the version.'
    group = 'help'
    def current = project.version
    doLast { println current }
}

tasks.register('nextVersion') {
    description = 'Prints the next version, the SNAPSHOT without its suffix.'
    group = 'help'
    def next = nextVersion
    doLast { println next }
}

// the repository's own libraries live on GitHub Packages, which needs a token even to read: GITHUB_ACTOR and GITHUB_TOKEN from
// the environment, CI's or gh's; the same repository resolves them and receives them
def githubPackages = {
    name = 'GitHubPackages'
    url = 'https://maven.pkg.github.com/mathmagicians/wonderland-eventing-playground'
    credentials {
        username = System.getenv('GITHUB_ACTOR')
        password = System.getenv('GITHUB_TOKEN')
    }
}

// the rest is for a project with code: a subproject here, the root of a story's build, and the root of this build,
// whose code is its own features under src/test
if (project != rootProject || subprojects.isEmpty() || file('src/test').exists()) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    // google-java-format in the AOSP style, the README's Formatting, at the version Spotless ships with: a newer
    // one fails inside Spotless on this JDK. spotlessCheck joins check. The generated sources stay as protoc
    // writes them.
    spotless {
        java {
            target 'src/*/java/**/*.java'
            targetExclude 'src/generated/**'
            googleJavaFormat().aosp()
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://packages.confluent.io/maven/' } // the Schema Registry client and the Protobuf serializer
        // the repository's own libraries: the developer loop installs them locally, make platform-install and discovery-install,
        // taken first; CI publishes them to GitHub Packages
        mavenLocal {
            content { includeGroup ourGroup }
        }
        maven {
            githubPackages.delegate = delegate
            githubPackages()
            content { includeGroup ourGroup }
        }
    }

    // versions come from the Spring Boot BOM; the Boot plugin's version, applied by the build that applies this file
    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        }
    }

    // the repository's own libraries float: the newest published version, and a re-published snapshot, are looked up on every build
    configurations.configureEach {
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }

    // the Cucumber runner runs from bdd, the architecture-discovery runner from archBdd, neither from test; the
    // architecture tests from archVerify as well; the writer of the architecture documents from arch-gen
    def cucumberRunner = '**/RunCucumberTest.class'
    def archBddRunner = '**/ArchBddTest.class'
    def archTests = ['**/ArchUnitTest.class', '**/ArchModulithTest.class']
    def architectureGenTag = 'architecture-gen'

    // lz4, the producer's compression, loads its native library from the class path, a restricted call the JDK
    // warns about once per JVM unless native access is granted; protobuf-java reaches sun.misc.Unsafe, which the
    // JDK warns about unless allowed; the mock maker's agent appends to the boot class path, which the JDK warns
    // about unless class data sharing is off
    def nativeAccess = '--enable-native-access=ALL-UNNAMED'
    def quietJvm = [nativeAccess, '--sun-misc-unsafe-memory-access=allow', '-Xshare:off']
    // Mockito's inline mock maker loads as an agent from the start, as Mockito asks, instead of attaching itself
    // while a test runs, which the JDK warns about
    configurations {
        mockitoAgent { transitive = false }
    }
    dependencies {
        mockitoAgent 'org.mockito:mockito-core'
    }
    def mockitoAgent = configurations.mockitoAgent
    tasks.withType(Test).configureEach {
        jvmArgs quietJvm
        inputs.files(mockitoAgent)
        jvmArgumentProviders.add({ ["-javaagent:${mockitoAgent.singleFile}"] } as CommandLineArgumentProvider)
    }

    tasks.named('test') {
        useJUnitPlatform {
            excludeTags architectureGenTag
        }
        exclude cucumberRunner
        exclude archBddRunner
    }

    // the architecture tests: the ArchUnit rules and Modulith's module boundaries
    tasks.register('archVerify', Test) {
        description = 'Runs the architecture tests, ArchUnitTest and ArchModulithTest.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            excludeTags architectureGenTag
        }
        include archTests
    }

    // the architecture-discovery features, which read what the build wrote, no image; their scenarios print as
    // they play
    tasks.register('archBdd', Test) {
        description = 'Runs the architecture-discovery features, ArchBddTest.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        include archBddRunner
        failOnNoDiscoveredTests = false
        testLogging.showStandardStreams = true
    }

    // the features of the project, against the image under test; a project without features has nothing to run
    tasks.register('bdd', Test) {
        description = 'Runs the Cucumber features. -PdryRun prints snippets for undefined steps without executing.'
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform()
        include cucumberRunner
        failOnNoDiscoveredTests = false
        def dryRun = providers.gradleProperty('dryRun').isPresent()
        if (dryRun) {
            systemProperty 'cucumber.execution.dry-run', 'true'
        }
        // the transport and the profiles the suite plays, -Ptransport=<transport> -Pprofiles=<transport>,<env>, from
        // make; the drivers hand the profiles to the containers they start
        def transport = providers.gradleProperty('transport').getOrElse('')
        def profiles = providers.gradleProperty('profiles').getOrElse('')
        // the tags of the scenarios a transport does not carry; the transports are TRANSPORTS of platform.mk
        def uncarried = [cli: ['@kafka', '@confluent'], kafka: ['@confluent'], confluent: []]
        doFirst {
            if (!uncarried.containsKey(transport) || !profiles) {
                throw new GradleException("-Ptransport=${transport} -Pprofiles=${profiles}: make passes both, the transport one of ${uncarried.keySet()}")
            }
        }
        systemProperty 'spring.profiles.active', profiles
        // the architecture-discovery features play with the unit tests, make arch-verify, never against the image
        def scenarios = providers.gradleProperty('scenarios').getOrElse(dryRun
                ? 'not @manual and not @architecture-discovery'
                : 'not @wip and not @manual and not @architecture-discovery')
        systemProperty 'cucumber.filter.tags',
                (["(${scenarios})"] + uncarried.getOrDefault(transport, []).collect { "not ${it}" }).join(' and ')
        // the image under test, -Pimage=<repo>:<tag>; default is the local build from bootBuildImage
        systemProperty 'bdd.image',
                providers.gradleProperty('image').getOrElse("${rootProject.name}:${project.version}")
        // the network of the kafka universe and the broker's and registry's addresses on it, -Pnetwork=<network>
        // -Pflock="NAME=value ...", from make on kafka; the drivers put the containers they start on the network
        // with the addresses in their environment
        systemProperty 'bdd.network', providers.gradleProperty('network').getOrElse('')
        systemProperty 'bdd.flock', providers.gradleProperty('flock').getOrElse('')
        testLogging.showStandardStreams = true
        outputs.upToDateWhen { false }
    }

    // a library goes to GitHub Packages, where other builds resolve it
    plugins.withId('maven-publish') {
        publishing {
            publications {
                maven(MavenPublication) {
                    from components.java
                }
            }
            repositories {
                maven {
                    githubPackages.delegate = delegate
                    githubPackages()
                }
            }
        }
    }

    // the project that builds the image: a distribution of the platform and its stories
    plugins.withId('org.springframework.boot') {
        springBoot {
            mainClass = 'dk.mathmagicians.wonderland.EventingPlatform'
        }

        // the local profile reads the console, so a run from source gets the terminal's input
        tasks.named('bootRun') {
            standardInput = System.in
            jvmArgs nativeAccess
        }

        tasks.named('bootBuildImage') {
            // the image name is the Makefile's, -Pimage=<name>:<tag>; the build's name when Gradle runs alone
            imageName = providers.gradleProperty('image').getOrElse("${rootProject.name}:${project.version}")
            // launch environment of the image, inherited by compose, docker run, and the integration tests
            environment = ['BPE_BPL_JAVA_NMT_ENABLED': 'false',
                           'BPE_DELIM_JAVA_TOOL_OPTIONS': ' ', 'BPE_APPEND_JAVA_TOOL_OPTIONS': nativeAccess]
            // the image is no file, so a build record is the output; with it Gradle skips the task while the jar
            // and the image name are unchanged
            def record = layout.buildDirectory.file("image/${project.version}.txt")
            def image = imageName
            outputs.file(record)
            doLast { record.get().asFile.text = "${image.get()}\n" }
        }

        // the architecture documents under docs/generated/architecture, -ParchitectureDocs for another place: the
        // tagged test writes the PlantUML sources and the canvases, PlantUML renders the diagrams to SVG with its
        // built-in layout engine, so no Graphviz is needed
        // findProperty, not providers.gradleProperty: the latter does not see a subproject's gradle.properties
        def docs = layout.projectDirectory.dir(findProperty('architectureDocs') ?: 'docs/generated/architecture')

        configurations {
            plantuml
        }

        dependencies {
            plantuml 'net.sourceforge.plantuml:plantuml-mit:1.2026.8' // not in the Boot BOM, 2026-09-08
        }

        tasks.register('generateArchitecture', Test) {
            description = 'Verifies the application modules and writes their PlantUML diagrams and canvases.'
            group = 'documentation'
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            useJUnitPlatform {
                includeTags architectureGenTag
            }
            exclude cucumberRunner
            exclude archBddRunner
            systemProperty 'architecture.docs', docs.asFile.path
            // the features of every project in the build, where the stories' behaviour features are found
            systemProperty 'architecture.features', rootProject.allprojects
                    .collect { it.file('src/test/resources/features') }
                    .findAll { it.directory }
                    .collect { it.path }
                    .join(File.pathSeparator)
            outputs.upToDateWhen { false }
        }

        // the model as specified, <story>.textproto written by hand under the test resources, -ParchitectureSpec for
        // another place, against the model generateArchitecture wrote: parsed and compared as messages, so the layout
        // of either does not count
        def spec = layout.projectDirectory.dir(findProperty('architectureSpec') ?: 'src/test/resources/architecture')
        tasks.register('archCheck', JavaExec) {
            description = 'Compares the specified .textproto files with the model generateArchitecture wrote.'
            group = 'verification'
            dependsOn tasks.named('generateArchitecture')
            classpath = sourceSets.test.runtimeClasspath
            mainClass = 'dk.mathmagicians.playground.architecture.model.ModelCheck'
            args spec.asFile.path, docs.dir('model').asFile.path
        }

        // the look of the hexagon, hexagon.style.puml in the architecture-discovery jar, taken out for PlantUML to
        // read as its config before each diagram
        def style = layout.buildDirectory.file('plantuml/hexagon.style.puml')
        tasks.register('diagramStyle') {
            description = 'Takes the diagram style out of the architecture-discovery jar.'
            group = 'documentation'
            def jar = configurations.testRuntimeClasspath.filter { it.name.startsWith('architecture-discovery-') }
            inputs.files(jar)
            outputs.file(style)
            doLast {
                new java.util.zip.ZipFile(jar.singleFile).withCloseable { zip ->
                    style.get().asFile.text = zip.getInputStream(zip.getEntry('hexagon.style.puml')).text
                }
            }
        }

        tasks.register('renderDiagrams', JavaExec) {
            description = 'Renders the PlantUML diagrams written by generateArchitecture to SVG.'
            group = 'documentation'
            dependsOn tasks.named('generateArchitecture'), tasks.named('diagramStyle')
            def sources = docs.dir('plantuml')
            def rendered = docs.dir('svg')
            inputs.files(fileTree(sources) { include '*.puml' })
            inputs.file(style)
            outputs.dir(rendered)
            classpath = configurations.plantuml
            mainClass = 'net.sourceforge.plantuml.Run'
            jvmArgs '-Djava.awt.headless=true'
            args '-tsvg', '-Playout=smetana', '-config', style.get().asFile.path, '-o', rendered.asFile.path,
                    "${sources.asFile}/*.puml"
        }
    }
}
