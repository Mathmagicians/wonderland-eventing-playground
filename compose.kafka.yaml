# The kafka universe the kafka transport plays on, what iac/ is for Confluent Cloud: a broker, a schema registry, a
# topic viewer, and the one-shot services that create the topics and register the schemas, `make kafka-universe-up`
# and `make kafka-universe-down`. The host reaches the broker on localhost:9092, the registry on localhost:8081, and
# the viewer on localhost:8082, the flock kafka:19092 and registry:8081; the project name is compose.yaml's, so both
# files put their containers on one network. make passes ENV and, from iac/locals.tf, the topic names and the
# partition count.
name: wonderland-eventing-playground

services:
  # a single KRaft node, broker and controller; a topic is created on first use, as the test containers do
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,FLOCK://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,FLOCK://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,FLOCK:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: FLOCK
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # the topics are the ones iac/ gives Confluent Cloud, created by make kafka-init; an unknown topic is an error
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Confluent's Schema Registry, the one Confluent Cloud runs, so the Protobuf serializer behaves the same
  registry:
    image: confluentinc/cp-schema-registry:8.3.1
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:8081
    environment:
      SCHEMA_REGISTRY_HOST_NAME: registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:19092
    # the image has no curl: healthy once the port answers, which Jetty opens when the registry has started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 5s
      timeout: 5s
      retries: 20

  # the topic viewer, localhost:8082: the topics, their messages decoded through the registry, the consumer groups
  viewer:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    depends_on:
      registry:
        condition: service_healthy
    ports:
      - 127.0.0.1:8082:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: wonderland
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://registry:8081
      DYNAMIC_CONFIG_ENABLED: "false"

  # the topics of ENV and their dead-letter twins, what iac/topics.tf creates on Confluent Cloud: created once, then
  # the service exits; a second run finds them and creates nothing
  topics:
    image: apache/kafka:4.2.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      ENV: ${ENV:?set by make, test or prod}
      TOPICS: ${KAFKA_TOPICS:?set by make, the names of iac/locals.tf}
      PARTITIONS: ${KAFKA_PARTITIONS:?set by make, the partition count of iac/locals.tf}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        set -o pipefail
        # kafka-topics.sh warns on every name with a period, which a metric name shares with an underscore; the
        # names have periods only, so the line is dropped
        for name in $$TOPICS; do for topic in $$ENV.$$name $$ENV.$$name.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic $$topic --partitions $$PARTITIONS --replication-factor 1 \
            | sed '/limitations in metric names/d'
        done; done

  # the schemas of ENV, what iac/schemas.tf registers on Confluent Cloud: each payload's proto under
  # <env>.<payload>s-value, the transaction with its imports as references; registered once, then the service
  # exits, and a second run registers nothing new
  schemas:
    image: curlimages/curl:8.23.0
    depends_on:
      registry:
        condition: service_healthy
    restart: "no"
    environment:
      ENV: ${ENV:?set by make, test or prod}
    volumes:
      - ./src/main/proto:/proto:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        json() { sed -e 's/\\/\\\\/g' -e 's/"/\\"/g' "$$1" | awk '{printf "%s\\n", $$0}'; }
        post() { out=$$(curl -sS --fail-with-body -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
                   --data @- "http://registry:8081/subjects/$$1/versions") || { echo "$$out"; exit 1; }
                 echo "  $$2 as $$1"; }
        echo "schemas of $$ENV:"
        for payload in product offer order; do
          printf '{"schemaType":"PROTOBUF","schema":"%s"}' "$$(json /proto/$$payload.proto)" \
            | post "$$ENV.$${payload}s-value" "$$payload.proto"
        done
        printf '{"schemaType":"PROTOBUF","schema":"%s","references":[{"name":"order.proto","subject":"%s.orders-value","version":1},{"name":"offer.proto","subject":"%s.offers-value","version":1}]}' \
          "$$(json /proto/transaction.proto)" "$$ENV" "$$ENV" | post "$$ENV.transactions-value" "transaction.proto"
