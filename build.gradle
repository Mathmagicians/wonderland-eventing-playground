// The build of the repository: the platform, the stories, and the distribution, see settings.gradle. Everything
// they share is platform.gradle, applied to every project; a project's own build.gradle holds its plugins and its
// dependencies.

plugins {
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.google.protobuf' version '0.10.0' apply false // not in the Boot BOM, 2026-09-03
    id 'com.diffplug.spotless' version '8.10.4' apply false // not in the Boot BOM, 2026-10-29
}

allprojects {
    apply from: "${rootDir}/platform.gradle"
}

// the features of the repository itself, src/test/resources/features: how we work. They read the fixtures' step
// patterns, the feature files, and the stories' reports, so the root's bdd plays after the subprojects'
dependencies {
    testImplementation(testFixtures(project(':platform'))) {
        exclude group: 'io.cucumber', module: 'cucumber-spring' // the features of the repository play without Spring
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bdd') {
    mustRunAfter subprojects.collect { "${it.path}:bdd" }
}

// the root has no main code, so no jar, and no unit tests: the features under src/test are its tests, run by bdd
tasks.named('jar') { enabled = false }
tasks.named('test') { failOnNoDiscoveredTests = false }
